<!DOCTYPE html>
<html lang="en">
    <head>
        <title>PrismArc - Support</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" href="favicon.png">
        <script src="fun.js"></script>
    </head>
    <body>
        <header>
            <h1><a href="index.html">PrismArc</a></h1>
            <a href="index.html" class="logo-link">
                <img src="prismarc-logo.png" alt="PrismArc Logo" class="logo">
            </a>
        </header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Product</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="support.html">Support</a></li>
            </ul>
        </nav>
        <div id="wrapper">
            <div id="supporthero"></div>
            <main>
                <div class="flow">
                    <section>
                        <form class="contact-form" action="https://webdevbasics.net/scripts/demo.php" method="post">

                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" required>

                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>

                            <label for="issue-type">Issue Type</label>
                            <select id="issue-type" name="issue-type" required>
                                <option value="">Select an issue…</option>
                                <option value="account">Account Problem</option>
                                <option value="billing">Billing Question</option>
                                <option value="technical">Technical Issue</option>
                                <option value="feedback">General Feedback</option>
                            </select>

                            <label for="priority">Priority Level</label>
                            <select id="priority" name="priority" size="3" required>
                                <option value="normal">Normal</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                            </select>

                            <label for="details">Describe Your Issue</label>
                            <textarea id="details" name="details" rows="6" required></textarea>

                            <button type="submit" class="cta-button">Submit Support Request</button>
                        </form>

                    </section>
                </div>
            </main>
        </div>
        <footer>
            
        </footer>
    </body>
</html>
