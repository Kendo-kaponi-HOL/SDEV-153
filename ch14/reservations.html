<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pacific Trails Resort::Reservations</title>
        <link href="pacific.css" rel="stylesheet">
        <script>
        function validateForm() {
        if (document.forms[0].myPhone.value == "" ) {
            alert("Phone field cannot be empty.");
            return false;
        } // end if
        if (document.forms[0].myNights.value > 14) {
            alert("Nights are more than 14. You can't stay more than two weeks.");
            return false;
        } // end if
        alert("Phone and Nights are valid.");
        return true;
        } // end function validateForm
        </script>
    </head>
    <body>
        <header>
            <h1><a href="index.html">Pacific Trails Resort</a></h1>
        </header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="yurts.html">Yurts</a></li>
                <li><a href="activities.html">Activities</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </nav>
        <div id="wrapper">
        <div id="reshero"></div>
        <main>
            <h2>Reservations at Pacific Trails</h2>
            <h3>Contact Us</h3>
            <p>Require fields are marked with an asterisk*</p>
            <form method="post" action="https://webdevbasics.net/scripts/pacific.php" onsubmit="return validateForm();">

                <label for="myName">*First Name:</label>
                <input type="text" name="myFName" id="myName" required>

                <label for="myLName">*Last Name:</label>
                <input type="text" name="myLName" id="myLName" required>

                <label for="myAddress">*Street Address:</label>
                <input type="text" name="myAddress" id="myAddress" required>

                <label for="myCity">*City:</label>
                <input type="text" name="myCity" id="myCity" required>

                <label for="myState">*State:</label>
                <input type="text" name="myState" id="myState" minlength="2" maxlength="2" required>

                <label for="myZip">*Zip Code:</label>
                <input type="text" name="myZip" id="myZip" minlength="5" maxlength="9" required>

                <label for="myEmail">*E-mail:</label>
                <input type="text" name="myEmail" id="myEmail" required>

                <label for="myPhone">*Phone:</label>
                <input type="text" name="myPhone" id="myPhone" minlength="10" maxlength="10">

                <label for="myDate">Arrival Date</label>
                <input type="date" name="myDate" id="myDate">

                <label for="myNights">Nights from 1 to 14:</label>
                <input type="number" name="myNights" id="myNights" min="1" max="14">


                <label for="myComments">Comments:</label>
                <textarea name="Comments" id="myComments" rows="2" cols="20"></textarea>

                <input type="submit" value="submit">
            </form>
        </main>
        <footer>
            Copyright &copy; 2020 Pacific Trails Resort<br>
            <a href="mailto:stephen@garcia.perez">stephen@garcia.perez</a>
        </footer>
        </div>
    </body>
</html>
